<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Venta de Coches</title>
    <!-- Vinculación a las hojas de estilo subiendo un nivel -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
</head>
<body>

    <!-- Encabezado / Navegación -->
    <header class="navbar">
        <div class="logo">
            <a href="../index.html">
                <img src="../assets/ICONS/logo.svg" alt="Logo Concesionario" width="150">
            </a>
        </div>
        <nav>
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="login.html" class="active">Iniciar Sesión</a></li>
            </ul>
        </nav>
    </header>

    <!-- Formulario de Login -->
    <main class="login-container">
        <div class="login-card">
            <h2>Acceso a tu Cuenta</h2>
            <p>Ingresa tus datos para gestionar tus solicitudes y vehículos guardados.</p>

            <form action="#" method="POST" id="form-login">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" name="remember"> Recordarme
                    </label>
                    <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="btn-primary">Iniciar Sesión</button>
            </form>

            <div class="login-footer">
                <p>¿No tienes una cuenta? <a href="#">Regístrate aquí</a></p>
            </div>
        </div>
    </main>

    <!--Scripts en JS subiendo un nivel -->
    <script src="../js/interacciones.js"></script>
</body>
</html>
